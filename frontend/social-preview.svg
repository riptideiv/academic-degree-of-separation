    <text x="72" y="233" font-family="Georgia, serif" font-size="76" font-weight="400">Research is a</text>
    <text x="72" y="308" font-family="Georgia, serif" font-size="76" font-weight="400">small world.</text>
    <text x="76" y="391" font-size="27" fill="#61685f">Follow the publications that connect</text>
    <text x="76" y="431" font-size="27" fill="#61685f">your professor and your favorite scientist.</text>
    <text x="76" y="554" font-size="22" fill="#61685f">Free to explore · Powered by OpenAlex</text>
  </g>
